version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: tea_shop_app
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    command: ["/app/entrypoint.sh"]

volumes:
  postgres_data:
